name: Snappy
description: >-
  Snappy is a corporate gifting platform that lets businesses send curated gifts,
  branded swag, and recipient-choice collections to employees and customers.
  Beyond its web app, Snappy publishes a developer API suite that embeds gifting
  into CRMs, HRIS platforms, and marketing-automation tools, triggering gifts from
  business events such as recognition moments, loyalty milestones, and sales-pipeline
  events, with budget controls and approval workflows. It also ships Slack and
  Microsoft Teams integrations. Backed by GGV Capital; sector hr-tech / corporate gifting.
